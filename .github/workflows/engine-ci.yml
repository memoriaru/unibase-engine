name: engine-ci

# P0 阶段 0 CI 矩阵: 后端(Unicorn2/Dynarmic) × OS(linux/mac)
# 范围说明(阶段0, 已知上游限制):
# - assemble 双平台全模块: 构建健康基线
# - unidbg-api 测试: 排除 HexTest.testStream(写死 Maven target/ 路径)
# - unidbg-android 测试: 显式白名单(上游无 CI, 重量级用例依赖已破损的 native/资源)
# - backend 模块测试与 emulator 类测试仅在 macos 跑: jitpack unicorn 1.0.14 的
#   linux natives 在 ubuntu-24.04 上原生崩溃(阶段1 自建 unicorn 后放开)
# - hongguo 基线(smokeTest)为本地专用, 专有样本不入库, CI 上空跑
on:
  push:
    branches: [master, 'unibase/**']
  pull_request:

jobs:
  backend-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [unicorn2, dynarmic]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble (release=8, temurin 21 工具链)
        run: ./gradlew assemble --no-daemon

      - name: unidbg-api 测试
        run: ./gradlew :unidbg-api:test --no-daemon

      - name: Android 白名单测试 + Backend 测试 (macos)
        if: matrix.os == 'macos-latest'
        run: ./gradlew :unidbg-android:test :backend:${{ matrix.backend }}:test --no-daemon

      - name: 本地基线入口空跑验证 (smokeTest 无样本时应绿)
        if: matrix.os == 'macos-latest'
        run: ./gradlew :unidbg-android:smokeTest -Pbackend=${{ matrix.backend }} --no-daemon
